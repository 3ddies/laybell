# Auto-publishes the legal pages to GitHub Pages whenever the documents change.
# One-time setup: GitHub repo → Settings → Pages → Source = "GitHub Actions".
# Your pages then live at https://<user>.github.io/<repo>/privacy.html (and
# /terms.html); add a CNAME / custom domain to map laybell.app if you like.
name: Deploy legal pages

on:
  push:
    branches: [dev]
    paths:
      - 'web/**'
      - 'lib/legal/**'
      - 'scripts/build-legal-html.mjs'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Rebuild HTML from the JSON source
        run: node scripts/build-legal-html.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web
      - id: deployment
        uses: actions/deploy-pages@v4
