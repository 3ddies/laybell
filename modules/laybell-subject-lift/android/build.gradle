plugins {
  id 'com.android.library'
  id 'expo-module-gradle-plugin'
}

// Laybell's local subject lifter (see ../index.ts). The Expo module plugin supplies
// Kotlin, expo-modules-core and the SDK levels; namespace and versionName are required
// by its publishing step.
group = 'expo.modules.laybellsubjectlift'
version = '1.0.0'

android {
  namespace "expo.modules.laybellsubjectlift"
  defaultConfig {
    versionCode 1
    versionName '1.0.0'
  }
}

dependencies {
  // ML Kit on-device Subject Segmentation — free, no cloud. The model is fetched once
  // through Google Play Services (see AndroidManifest meta-data). This API ships ONLY as
  // the Play-Services-delivered artifact (com.google.android.gms:play-services-mlkit-*),
  // not the standalone com.google.mlkit namespace; the import package is still
  // com.google.mlkit.vision.segmentation.subject.
  implementation 'com.google.android.gms:play-services-mlkit-subject-segmentation:16.0.0-beta1'
}
